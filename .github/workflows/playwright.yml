name: Playwright Tests

on:
  workflow_dispatch:
    inputs:
      quality_gate_profile:
        description: 'Quality Gate Profile to evaluate'
        required: false
        type: choice
        default: ''
        options:
          - ''
          - Quality_Gate_Pass
          - Quality_Gate_Fail
      is_rerun:
        description: 'Upload as a rerun of an existing build (maps to latest build run with the same build name)'
        required: false
        type: boolean
        default: false
      build_name:
        description: 'Original build name (required when is_rerun is true)'
        required: false
        type: string
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npm test

      - name: Bundle test results
        if: always()
        run: node scripts/bundle-results.js

      - name: Upload results to BrowserStack Test Management
        if: always()
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          QUALITY_GATE_PROFILE: ${{ inputs.quality_gate_profile }}
          IS_RERUN: ${{ inputs.is_rerun }}
          BUILD_NAME: ${{ inputs.build_name }}
        run: node browserstack_pipeline.js

      - name: Upload artifacts to GitHub (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
